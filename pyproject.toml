[project]
name = "aoc"
version = "0.1.0"
description = "My Advent of Code Solutions in Python (No AI)"
readme = "README.md"
authors = [{ name = "Thomas Eckert", email = "thomas.james.eckert@gmail.com" }]
requires-python = ">=3.13"
dependencies = ["httpx>=0.28.1", "python-dotenv>=1.2.4"]

[project.scripts]
aoc = "aoc:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
